name: Publish mod

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate only (no publishing)
        type: boolean
        default: true
      target:
        description: Publish to
        type: choice
        options: [both, modrinth, curseforge]
        default: both
      release_type:
        description: Release channel
        type: choice
        options: [release, beta, alpha]
        default: release
      changelog:
        description: Release notes (Markdown)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-mod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      minecraft: ${{ steps.metadata.outputs.minecraft }}
      jar: ${{ steps.metadata.outputs.jar }}
      platforms: ${{ steps.metadata.outputs.platforms }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build
        run: ./gradlew clean build --no-daemon
      - name: Validate release metadata
        id: metadata
        env:
          PUBLISH_TARGET: ${{ inputs.target }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import zipfile
          from pathlib import Path

          properties = {}
          for line in Path('gradle.properties').read_text().splitlines():
              if line.strip() and not line.lstrip().startswith('#') and '=' in line:
                  key, value = line.split('=', 1)
                  properties[key.strip()] = value.strip()
          version = properties['mod_version']
          minecraft = properties['minecraft_version']
          archive = properties['archives_base_name']
          for value in (version, minecraft, archive):
              if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._+-]*', value):
                  raise SystemExit(f'Invalid release metadata: {value!r}')
          jar = f'{archive}-{version}.jar'
          with zipfile.ZipFile(Path('build/libs') / jar) as artifact:
              metadata = json.loads(artifact.read('fabric.mod.json'))
          if metadata['version'] != version:
              raise SystemExit('Built mod version differs from gradle.properties')
          if metadata['depends']['minecraft'] != f'~{minecraft}':
              raise SystemExit('Update fabric.mod.json to match minecraft_version')
          target = os.environ['PUBLISH_TARGET']
          platforms = ['modrinth', 'curseforge'] if target == 'both' else [target]
          if any(platform not in ('modrinth', 'curseforge') for platform in platforms):
              raise SystemExit('Invalid publishing target')
          platforms = [dict(platform=platform, token=f'{platform.upper()}_TOKEN')
                       for platform in platforms]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in dict(version=version, minecraft=minecraft,
                                     jar=jar, platforms=json.dumps(platforms)).items():
                  print(f'{key}={value}', file=output)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Built **{jar}** for Minecraft **{minecraft}** (Fabric).\n')
          PY
      - name: Save installable mod jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mod-jar
          path: build/libs/${{ steps.metadata.outputs.jar }}
          if-no-files-found: error

  publish:
    if: ${{ !inputs.dry_run }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.platforms) }}
    steps:
      - name: Check publishing token
        env:
          TOKEN: ${{ secrets[matrix.token] }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the GitHub Actions repository secret for $PLATFORM (MODRINTH_TOKEN or CURSEFORGE_TOKEN)."
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mod-jar
          path: dist
      - name: Publish to ${{ matrix.platform }}
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          modrinth-id: ${{ matrix.platform == 'modrinth' && 'flmhXQgb' || '' }}
          modrinth-token: ${{ matrix.platform == 'modrinth' && secrets.MODRINTH_TOKEN || '' }}
          curseforge-id: ${{ matrix.platform == 'curseforge' && '473175' || '' }}
          curseforge-token: ${{ matrix.platform == 'curseforge' && secrets.CURSEFORGE_TOKEN || '' }}
          files: dist/${{ needs.build.outputs.jar }}
          name: ClientSideNoteblocks ${{ needs.build.outputs.version }} for Minecraft ${{ needs.build.outputs.minecraft }}
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ inputs.release_type }}
          changelog: ${{ inputs.changelog }}
          loaders: fabric
          environment: client
          game-versions: ${{ needs.build.outputs.minecraft }}
          game-version-filter: none
          java: '25'
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            modmenu(optional){modrinth:mOgUt4GM}{curseforge:308702}
            cloth-config(embedded){modrinth:9s6osm5g}{curseforge:348521}
